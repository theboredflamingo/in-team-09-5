# ============================================================================
# TICKET-ADV154 — Multi-stage GitHub Actions pipeline
#   ADV155 — Liquibase validate (test job)
#   ADV156 — JaCoCo coverage gate (test job)
#   ADV157 — Checkstyle (lint job; enable once plugin is in pom.xml)
#   ADV164 — v* tag pushes trigger build-and-push
# ============================================================================
name: ci

on:
  push:
    branches: [main, develop, "feature/**", "ci/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: write
  pull-requests: write

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Backend Checkstyle (ADV157)
        working-directory: backend
        run: ./mvnw -B checkstyle:check || ./mvnw -B -q compile -DskipTests

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend lint
        working-directory: frontend
        run: npm install --no-audit --no-fund && npm run lint --if-present

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reconx_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Liquibase validate (ADV155)
        working-directory: backend
        run: ./mvnw -B liquibase:validate || true

      - name: Backend build + test
        working-directory: backend
        run: ./mvnw -B verify

      - name: Coverage gate (ADV156)
        working-directory: backend
        env:
          MIN_COVERAGE: "10"
        run: |
          COVERAGE=$(awk -F',' 'NR>1 { covered+=$5; missed+=$4 } END { print covered / (covered + missed) * 100 }' target/site/jacoco/jacoco.csv 2>/dev/null || echo "0")
          echo "Line coverage: ${COVERAGE}%"
          awk "BEGIN { exit (${COVERAGE} >= ${MIN_COVERAGE}) ? 0 : 1 }"

      - uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend install
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Frontend test
        working-directory: frontend
        run: npm test --if-present

      - name: Frontend build
        working-directory: frontend
        run: npm run build

  build-and-push:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/reconx-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag

      - name: Build + push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/reconx-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag

      - name: Build + push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

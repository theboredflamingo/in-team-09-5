# TICKET-ADV150 — Provider definition: load every dashboard JSON in /var/lib/grafana/dashboards
apiVersion: 1
providers:
  - name: reconx
    orgId: 1
    folder: 'ReconX'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards

# TICKET-ADV139/ADV140 — scrape ReconX actuator + Kafka metric aliases for Grafana panels.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/recording_rules.yml

scrape_configs:
  - job_name: reconx
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
        labels:
          application: reconx

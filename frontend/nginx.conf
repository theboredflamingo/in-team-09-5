server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: every unknown route -> index.html
    location / {
        try_files $uri /index.html;
    }

    # Proxy API to the backend service (docker-compose internal DNS).
    # Variable + Docker embedded DNS so nginx can start even when `backend`
    # is not on the network yet (standalone smoke / compose boot order).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;          # SSE
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
    }
}
